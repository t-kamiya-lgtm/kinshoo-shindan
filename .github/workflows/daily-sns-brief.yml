name: SNS投稿案の毎日チェック

# メール通知は運用しない方針になったため、送信ステップは外してある。
# 残しているのは毎日の自己診断で、文面を足したときに法令チェックや文字数の
# 上限に触れる表現が混ざっていないかを、毎朝 8:00 JST に総当たりで確かめる。
# 当日の提案は成果物（brief.html）として残るので、必要なら Actions から見られる。
on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '対象日（YYYY-MM-DD／空なら今日）'
        required: false

permissions:
  contents: read

jobs:
  brief:
    runs-on: ubuntu-latest
    env:
      # brief.html の中のボタンのリンク先。未設定なら GitHub Pages の既定URLを組み立てる。
      DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
      GITHUB_REPOSITORY_OWNER_NAME: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 生成エンジンの自己診断（法令チェック・文字数）
        run: node sns/selftest.js

      - name: メール本文を組み立てる
        env:
          BRIEF_DATE: ${{ github.event.inputs.date }}
        run: |
          echo "DATE_JST=$(TZ=Asia/Tokyo date +%Y-%m-%d)" >> "$GITHUB_ENV"
          node scripts/daily-brief.mjs > brief.html
          wc -c brief.html

      - name: 生成物を保存（Actions の画面から中身を確認できる）
        uses: actions/upload-artifact@v4
        with:
          name: sns-brief-${{ env.DATE_JST }}
          path: brief.html
          retention-days: 14
